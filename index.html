<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDSM Biblioteca - Soberano de los Sueños</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-image: url('https://tse2.mm.bing.net/th/id/OIP.lESxznKRsdKA4S76Z51x0gHaHa?r=0&w=626&h=626&rs=1&pid=ImgDetMain&o=7&rm=3');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
    }

    /* Overlay oscuro para legibilidad */
    .overlay {
      background: rgba(10, 8, 20, 0.88);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Navegación */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      background: rgba(18, 15, 35, 0.95);
      border-bottom: 1px solid rgba(138, 43, 226, 0.3);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: #a855f7;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .user-stats {
      display: flex;
      gap: 15px;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 15px;
      border-radius: 20px;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .rank-badge {
      color: #e9d5ff;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* Contenedor Principal */
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      border-left: 4px solid #a855f7;
      padding-left: 10px;
    }

    /* Grid de Cómics / Obras */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(24, 20, 47, 0.8);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #a855f7;
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card-info {
      padding: 12px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-type {
      font-size: 0.75rem;
      color: #a855f7;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="overlay">
    
    <!-- Barra Superior -->
    <nav>
      <div class="logo">RDSM Biblioteca</div>
      <div class="user-stats">
        <span>🌙 Nivel 1: <strong class="rank-badge">Mortal Dormido</strong></span>
        <span>⚡ XP: 0/100</span>
      </div>
    </nav>

    <!-- Contenido -->
    <div class="container">
      <h2 class="section-title">Obras Destacadas</h2>
      
      <div class="grid">
        <!-- Ejemplo de Tarjeta 1 -->
        <div class="card">
          <img src="https://tse2.mm.bing.net/th/id/OIP.lESxznKRsdKA4S76Z51x0gHaHa?r=0&w=626&h=626&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Portada">
          <div class="card-info">
            <div class="card-title">Soberano de los Sueños</div>
            <div class="card-type">Manhwa • Capítulo 1</div>
          </div>
        </div>
      </div>
    </div>

<!-- Librería de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Script de Conexión -->
  <script>

  </div>
</body>
</html>
