<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDSM Biblioteca - Soberano de los Sueños</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-image: url('https://tse2.mm.bing.net/th/id/OIP.lESxznKRsdKA4S76Z51x0gHaHa?r=0&w=626&h=626&rs=1&pid=ImgDetMain&o=7&rm=3');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
    }

    /* Overlay oscuro para legibilidad */
    .overlay {
      background: rgba(10, 8, 20, 0.88);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Navegación */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      background: rgba(18, 15, 35, 0.95);
      border-bottom: 1px solid rgba(138, 43, 226, 0.3);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: #a855f7;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .user-stats {
      display: flex;
      gap: 15px;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 15px;
      border-radius: 20px;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .rank-badge {
      color: #e9d5ff;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* Contenedor Principal */
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      border-left: 4px solid #a855f7;
      padding-left: 10px;
    }

    /* Grid de Cómics / Obras */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(24, 20, 47, 0.8);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #a855f7;
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card-info {
      padding: 12px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-type {
      font-size: 0.75rem;
      color: #a855f7;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="overlay">
    
    <!-- Barra Superior -->
    <nav>
      <div class="logo">RDSM Biblioteca</div>
      <div class="user-stats">
        <span>🌙 Nivel 1: <strong class="rank-badge">Mortal Dormido</strong></span>
        <span>⚡ XP: 0/100</span>
      </div>
    </nav>

    <!-- Contenido -->
    <div class="container">
      <h2 class="section-title">Obras Destacadas</h2>
      
      <div class="grid">
        <!-- Ejemplo de Tarjeta 1 -->
        <div class="card">
          <img src="https://tse2.mm.bing.net/th/id/OIP.lESxznKRsdKA4S76Z51x0gHaHa?r=0&w=626&h=626&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Portada">
          <div class="card-info">
            <div class="card-title">Soberano de los Sueños</div>
            <div class="card-type">Manhwa • Capítulo 1</div>
          </div>
        </div>
      </div>
    </div>

<!-- Botón visible de Inicio / Registro en la barra superior -->
  <div style="position: absolute; top: 15px; right: 20px; display: flex; gap: 10px;">
    <button onclick="mostrarModal()" style="background: #8a2be2; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Acceder / Registrarse</button>
  </div>

  <!-- Ventana Modal de Autenticación -->
  <div id="authModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: #1a1a2e; padding: 30px; border-radius: 12px; border: 1px solid #8a2be2; width: 300px; color: white; position: relative;">
      <span onclick="cerrarModal()" style="position: absolute; right: 15px; top: 10px; cursor: pointer; font-size: 20px;">✕</span>
      <h3 id="modalTitle" style="margin-top: 0; color: #a855f7;">Iniciar Sesión</h3>
      
      <input type="email" id="authEmail" placeholder="Correo electrónico" style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #333; background: #0f0f1a; color: white; box-sizing: border-box;">
      <input type="password" id="authPassword" placeholder="Contraseña" style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #333; background: #0f0f1a; color: white; box-sizing: border-box;">
      <input type="text" id="authUsername" placeholder="Nombre de usuario (solo para registro)" style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #333; background: #0f0f1a; color: white; box-sizing: border-box; display: none;">

      <button id="btnSubmit" onclick="ejecutarAuth()" style="width: 100%; background: #8a2be2; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;">Entrar</button>
      
      <p style="font-size: 12px; margin-top: 15px; text-align: center; color: #aaa;">
        <span id="toggleText">¿No tienes cuenta?</span> 
        <a href="#" onclick="cambiarModo()" id="toggleLink" style="color: #a855f7; text-decoration: none; font-weight: bold;">Regístrate aquí</a>
      </p>
    </div>
  </div>

  <!-- Conexión Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://pbntavryahcdmemussxj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ovqY_u8wEJeq72Xx6Jl1Pg_nraMC9Pe";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let esRegistro = false;

    function mostrarModal() { document.getElementById('authModal').style.display = 'flex'; }
    function cerrarModal() { document.getElementById('authModal').style.display = 'none'; }

    function cambiarModo() {
      esRegistro = !esRegistro;
      document.getElementById('modalTitle').innerText = esRegistro ? 'Crear Cuenta' : 'Iniciar Sesión';
      document.getElementById('btnSubmit').innerText = esRegistro ? 'Registrarse' : 'Entrar';
      document.getElementById('authUsername').style.display = esRegistro ? 'block' : 'none';
      document.getElementById('toggleText').innerText = esRegistro ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?';
      document.getElementById('toggleLink').innerText = esRegistro ? 'Inicia sesión' : 'Regístrate aquí';
    }

    async function ejecutarAuth() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const username = document.getElementById('authUsername').value;

      if(!email || !password) return alert("Completa los campos");

      if (esRegistro) {
        const { data, error } = await supabase.auth.signUp({
          email, password, options: { data: { username: username || email.split('@')[0] } }
        });
        if (error) alert("Error: " + error.message);
        else { alert("¡Registro exitoso! Ya puedes iniciar sesión."); cerrarModal(); }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert("Error: " + error.message);
        else { alert("¡Bienvenido!"); location.reload(); }
      }
    }
  </script>
</body>
</html>
