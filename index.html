<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDSM Biblioteca - Reino de los Sueños de Morfeo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0b18;
      color: #ffffff;
    }

    /* BARRA SUPERIOR (HEADER) */
    header {
      background: #151226;
      border-bottom: 1px solid #2a244d;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #a855f7;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #8a2be2, #4b0082);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* BADGE DE NIVEL Y XP */
    .user-level-badge {
      background: #1f1a3a;
      border: 1px solid #8a2be2;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-auth {
      background: #8a2be2;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-auth:hover {
      background: #a855f7;
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.4rem;
      color: #ffffff;
      border-left: 4px solid #8a2be2;
      padding-left: 10px;
      margin-bottom: 20px;
    }

    /* GRID DE OBRAS */
    .grid-obras {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background: #151226;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #2a244d;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-img {
      width: 100%;
      height: 240px;
      background: #2a244d;
      object-fit: cover;
    }

    .card-info {
      padding: 12px;
    }

    .card-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .card-type {
      font-size: 12px;
      color: #a855f7;
    }

    /* MODAL DE AUTENTICACIÓN */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #151226;
      border: 1px solid #8a2be2;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      padding: 25px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      right: 15px; top: 10px;
      font-size: 22px;
      cursor: pointer;
      color: #aaa;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #2a244d;
      background: #0d0b18;
      color: white;
    }

    .btn-submit {
      width: 100%;
      background: #8a2be2;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="nav-left">
      <a href="index.html" class="logo-btn">
        <div class="logo-badge">🌙</div>
        <span>RDSM BIBLIOTECA</span>
      </a>
    </div>

    <div class="nav-right">
      <div class="user-level-badge">
        <span>🌙 Nivel 1: Mortal Dormido</span>
        <span style="color: #a855f7;">⚡ XP: 0/100</span>
      </div>
      <button class="btn-auth" onclick="mostrarModal()">Acceder / Registrarse</button>
    </div>
  </header>

  <!-- CONTENIDO -->
  <div class="container">
    <h2 class="section-title">Obras Destacadas</h2>

    <div class="grid-obras">
      <div class="card">
        <div class="card-img" style="background-image: url('https://via.placeholder.com/180x240'); background-size: cover;"></div>
        <div class="card-info">
          <div class="card-title">Soberano de los Sueños</div>
          <div class="card-type">Manhwa • Capítulo 1</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <span class="close-btn" onclick="cerrarModal()">✕</span>
      <h3 id="modalTitle" style="color: #a855f7; margin-bottom: 15px;">Iniciar Sesión</h3>

      <input type="email" id="authEmail" class="input-field" placeholder="Correo electrónico">
      <input type="password" id="authPassword" class="input-field" placeholder="Contraseña">
      <input type="text" id="authUsername" class="input-field" placeholder="Nombre de usuario" style="display: none;">

      <button id="btnSubmit" class="btn-submit" onclick="ejecutarAuth()">Entrar</button>

      <p style="font-size: 12px; margin-top: 15px; text-align: center; color: #aaa;">
        <span id="toggleText">¿No tienes cuenta?</span> 
        <a href="#" onclick="cambiarModo()" id="toggleLink" style="color: #a855f7; text-decoration: none; font-weight: bold;">Regístrate aquí</a>
      </p>
    </div>
  </div>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://pbntavryahcdmemussxj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ovqY_u8wEJeq72Xx6Jl1Pg_nraMC9Pe";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let esRegistro = false;

    function mostrarModal() {
      document.getElementById('authModal').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('authModal').style.display = 'none';
    }

    function cambiarModo() {
      esRegistro = !esRegistro;
      document.getElementById('modalTitle').innerText = esRegistro ? 'Crear Cuenta' : 'Iniciar Sesión';
      document.getElementById('btnSubmit').innerText = esRegistro ? 'Registrarse' : 'Entrar';
      document.getElementById('authUsername').style.display = esRegistro ? 'block' : 'none';
      document.getElementById('toggleText').innerText = esRegistro ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?';
      document.getElementById('toggleLink').innerText = esRegistro ? 'Inicia sesión' : 'Regístrate aquí';
    }

    async function ejecutarAuth() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const username = document.getElementById('authUsername').value;

      if (!email || !password) return alert("Por favor llena correo y contraseña.");

      if (esRegistro) {
        const { data, error } = await supabase.auth.signUp({
          email, password, options: { data: { username: username || email.split('@')[0] } }
        });
        if (error) alert("Error: " + error.message);
        else { alert("¡Registro exitoso! Ya puedes iniciar sesión."); cerrarModal(); }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert("Error: " + error.message);
        else { alert("¡Bienvenido de nuevo!"); location.reload(); }
      }
    }
  </script>
</body>
</html>
